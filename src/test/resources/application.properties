spring.application.name=D2H-test

# ── H2 in-memory for tests ────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:d2h_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ── Flyway disabled for unit/slice tests (DDL managed by Hibernate) ───────────
spring.flyway.enabled=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtbXVzdC1iZS0yNTYtYml0cy1sb25n
app.jwt.expiration-ms=3600000

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
