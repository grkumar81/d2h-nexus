spring.application.name=D2H

# ── Datasource ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/d2h_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:d2h_user}
spring.datasource.password=${DB_PASSWORD:d2h_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection pool (HikariCP) ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-256-bit-base64-encoded-value-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=D2H Distributor Management Platform
info.app.version=0.0.1-SNAPSHOT

# ── Logging ───────────────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.org.nexus.d2h=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
